name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and tests
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test CLI
        run: |
          python -m plasmawavelab sagdeev --mach 1.2 --output results/sagdeev
          python -m plasmawavelab kdv --n 256 --time 0.2 --output results/kdv
      - name: Reproduce manuscript verification results
        if: matrix.python-version == '3.12'
        run: python examples/verification.py --output results/verification
      - name: Upload verification results
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: results/verification
